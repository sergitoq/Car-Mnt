+'<td><span class="'+stClass(a.estado)+'">' +a.estado+'</span></td>'
+'<td class="'+fkCls+'">'+a.faltaKm.toLocaleString()+'</td>'
+'<td class="'+fmCls+'">'+a.faltaM+'</td>'
+'<td>'+(a.mant||'—')+'</td>'
+'<td>'+(a.repOk||'—')+'</td>';
tb.appendChild(tr);
makeEditable(document.getElementById('eUF'+a.row),'alt_ultF_'+a.row);
makeEditable(document.getElementById('eIK'+a.row),'alt_intKm_'+a.row);
makeEditable(document.getElementById('eMS'+a.row),'alt_meses_'+a.row);
});
}
function renderHist(){
let q=document.getElementById('buscar').value.toLowerCase();
let cat=document.getElementById('filtCat').value;
let sort=document.getElementById('sortDir').value;
let newRecs=JSON.parse(lsGet('hist_new')||'[]');
let all=[...historial,...newRecs];
let filtered=all.filter(r=>{
let mq=!q||(r.d.toLowerCase().includes(q)||String(r.km).includes(q)||(r.n||'').toLowerCase().includes(q));
let mc=!cat||r.c===cat;
return mq&&mc;
});
filtered.sort((a,b)=>sort==='asc'?a.km-b.km:b.km-a.km);
let tb=document.getElementById('hist-body');tb.innerHTML='';
filtered.forEach(r=>{
let tr=document.createElement('tr');
if(r._new)tr.className='tr-new';
tr.innerHTML='<td style="text-align:right;white-space:nowrap">'
+(r.km?r.km.toLocaleString():'—')+'</td>'
+'<td style="white-space:nowrap">'+(r.f||'')+'</td>'
+'<td><span class="badge '+catClass(r.c)+'">'+(r.c||'')+'</span></td>'
+'<td>'+(r.d||'')+(r._new?' <span class="mod-star">nuevo</span>':'')+'</td>'
+'<td>'+(r.n||'')+'</td>';
tb.appendChild(tr);
});
}
function toggleAddForm(){
let f=document.getElementById('add-form');
f.classList.toggle('open');
if(f.classList.contains('open'))document.getElementById('f-km').focus();
}
function agregarRegistro(){
let km=parseInt(document.getElementById('f-km').value)||0;
let fd=document.getElementById('f-fecha').value;
let fecha='';
if(fd){let p=fd.split('-');fecha=p[2]+'/'+p[1]+'/'+p[0];}
let cat=document.getElementById('f-cat').value;
let desc=document.getElementById('f-desc').value.trim();
let notas=document.getElementById('f-notas').value.trim();
if(!desc){alert('Ingresa una descripcion');return;}
let recs=JSON.parse(lsGet('hist_new')||'[]');
recs.push({km:km,f:fecha,c:cat,d:desc,n:notas,_new:true});
lsSet('hist_new',JSON.stringify(recs));
document.getElementById('f-km').value='';
document.getElementById('f-fecha').value='';
document.getElementById('f-desc').value='';
document.getElementById('f-notas').value='';
toggleAddForm();
renderHist();
}
function exportarJSON(){
let exp={version:htmlVersion,alertas_mod:[],hist_new:[]};
alertas.forEach(a=>{
let mUltF=lsGet('alt_ultF_'+a.row);
let mIntKm=lsGet('alt_intKm_'+a.row);
let mMeses=lsGet('alt_meses_'+a.row);
if(mUltF!==null||mIntKm!==null||mMeses!==null){
exp.alertas_mod.push({row:a.row,svc:a.svc,
ultF:mUltF,intKm:mIntKm!==null?parseInt(mIntKm):null,meses:mMeses!==null?parseInt(mMeses):null});}
});
exp.hist_new=JSON.parse(lsGet('hist_new')||'[]');
let blob=new Blob([JSON.stringify(exp,null,2)],{type:'application/json'});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);
a.download='mant_feedback.json';a.click();
}
function resetMods(){
if(!confirm('Borrar todos los cambios locales?'))return;
lsClear();lsSet('htmlVersion',htmlVersion);
renderAlt();renderHist();
}
var rotando=false;
function toggleRotacion(){
rotando=!rotando;
var inner=document.getElementById('alt-wrap-inner');
var btn=document.getElementById('btn-rot');
if(rotando){
showTab('alt');
var ancho=window.innerWidth;
var alto=window.innerHeight;
document.querySelector('.topbar').style.display='none';
document.querySelector('.tabs').style.display='none';
inner.style.cssText='position:fixed;top:0;left:0;width:'+alto+'px;height:'+ancho+'px;transform:rotate(90deg) translateY(-'+ancho+'px);transform-origin:top left;overflow:auto;background:#0d0d0d;padding:6px;z-index:100';
document.body.style.overflow='hidden';
btn.innerHTML='&#8634;';
}else{
document.querySelector('.topbar').style.display='';
document.querySelector('.tabs').style.display='';
inner.style.cssText='';
document.body.style.overflow='';
btn.innerHTML='&#8635;';
}}
window.onload=function(){
if(lsGet('htmlVersion')!==htmlVersion){lsClear();lsSet('htmlVersion',htmlVersion);}
renderAlt();renderHist();
};
</script></body></html>
